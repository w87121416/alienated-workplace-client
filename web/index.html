<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alienated Workplace Client</title>
    <style>
      :root {
        color-scheme: dark;
        background: #11161c;
        color: #f4f1df;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(249, 198, 42, 0.18), transparent 36%),
          linear-gradient(315deg, rgba(35, 188, 174, 0.13), transparent 42%),
          #11161c;
      }

      main {
        width: min(760px, calc(100vw - 40px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 7vw, 72px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 620px;
        color: #d8d5c5;
        font-size: 18px;
        line-height: 1.6;
      }

      .tag {
        display: inline-block;
        margin-bottom: 18px;
        padding: 6px 10px;
        border: 2px solid #f9c62a;
        color: #f9c62a;
        font-weight: 800;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">Independent Web Client</div>
      <h1>Alienated Workplace</h1>
      <p>独立网页端入口占位。后续只通过 PlayFab 云端权威读取玩家数据，并与 Steam 客户端账号绑定到同一个 PlayFabId。</p>
    </main>
  </body>
</html>
